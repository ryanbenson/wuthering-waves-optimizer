name: E2E Tests

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard:
          - data-validation
          - optimizer
          - team-rotations
          - calculator-core

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests (${{ matrix.shard }})
        run: |
          npx vite dev &
          npx wait-on http://localhost:5173
          npm run cypress:run:${{ matrix.shard }}
