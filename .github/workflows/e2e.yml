name: E2E Tests

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: data-validation
            specs: cypress/e2e/calculator/data-validation/**/*.cy.ts
          - name: optimizer
            specs: cypress/e2e/calculator/optimizer/**/*.cy.ts
          - name: team-rotations
            specs: cypress/e2e/teamRotations/**/*.cy.ts
          - name: calculator-core
            specs: cypress/e2e/calculator/*.cy.ts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests (${{ matrix.name }})
        run: |
          npx vite dev &
          npx wait-on http://localhost:5173
          npx cypress run --spec "${{ matrix.specs }}"
